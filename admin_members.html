{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <p class="brand">บันทึกสุขภาพ</p>
    <form method="POST">
      <label>วันที่</label>
      <input type="date" name="record_date" required>
      <label>น้ำหนัก (kg)</label>
      <input type="number" step="0.1" name="weight_kg" required>
      <label>เปอร์เซ็นต์ไขมัน</label>
      <input type="number" step="0.1" name="body_fat_percent">
      <button type="submit" class="btn-primary">บันทึก</button>
    </form>
    <p class="auth-link"><a href="{{ url_for('dashboard') }}">กลับหน้าแดชบอร์ด</a></p>
  </div>
</div>
{% endblock %}
