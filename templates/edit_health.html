{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <p class="brand">แก้ไขบันทึกสุขภาพ</p>
    <form method="POST">
      <label>วันที่</label>
      <input type="date" name="record_date" value="{{ record.record_date }}" required>
      <label>น้ำหนัก (kg)</label>
      <input type="number" step="0.1" name="weight_kg" value="{{ record.weight_kg }}" required>
      <label>เปอร์เซ็นต์ไขมัน</label>
      <input type="number" step="0.1" name="body_fat_percent" value="{{ record.body_fat_percent or '' }}">
      <button type="submit" class="btn-primary">บันทึกการแก้ไข</button>
    </form>
    <p class="auth-link"><a href="{{ url_for('health.history') }}">กลับหน้าประวัติ</a></p>
  </div>
</div>
{% endblock %}
