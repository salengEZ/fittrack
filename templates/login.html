{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <p class="brand">FitTrack</p>
    <form method="POST">
      <label>อีเมล</label>
      <input type="email" name="email" placeholder="name@email.com" required>
      <label>รหัสผ่าน</label>
      <input type="password" name="password" required>
      <button type="submit" class="btn-primary">เข้าสู่ระบบ</button>
    </form>
    <p class="auth-link">ยังไม่มีบัญชี? <a href="{{ url_for('auth.register') }}">สมัครสมาชิก</a></p>
  </div>
</div>
{% endblock %}
